<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Vigram | پلتفرم ویدیویی</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@uploadcare/file-uploader@1/web/uc-file-uploader-regular.min.css">
<script src="https://api.backendless.com/sdk/js/latest/backendless.min.js"></script>

<script>
(function(){
    if(typeof window.customElements.getName === 'function') return;
    var registry = new Map();
    var origDefine = window.customElements.define.bind(window.customElements);
    window.customElements.define = function(name, constructor, options){
        try { registry.set(constructor, name); } catch(e){}
        return origDefine(name, constructor, options);
    };
    window.customElements.getName = function(constructor){
        if(!constructor) return null;
        if(registry.has(constructor)) return registry.get(constructor);
        try { if(constructor.name) return constructor.name; } catch(e){}
        return null;
    };
})();
</script>

<style>
  :root {
    --bg: #0f0f0f; --card: rgba(30, 30, 30, 0.6); --card-hover: rgba(44, 44, 44, 0.8);
    --text: #f1f1f1; --muted: #a0a0a0; --red: #ff0000; --border: rgba(255,255,255,0.08);
    --radius: 16px; --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    --glass-blur: blur(15px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; overflow-x: hidden; }
  
  .app-wrapper { width: 100%; max-width: 1200px; background: var(--bg); min-height: 100vh; position: relative; padding-bottom: 80px; display: flex; flex-direction: column; }
  
  /* Topbar (Glassmorphism) */
  .topbar { background: rgba(15, 15, 15, 0.75); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; gap: 15px; }
  .logo { font-weight: 900; font-size: 24px; display: flex; align-items: center; gap: 8px; cursor: pointer; letter-spacing: -0.5px; }
  .logo i { color: var(--red); font-size: 28px; text-shadow: 0 0 20px rgba(255,0,0,0.4); }
  .search-bar { flex: 1; max-width: 500px; display: flex; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 30px; overflow: hidden; transition: var(--transition); }
  .search-bar:focus-within { border-color: var(--red); box-shadow: 0 0 15px rgba(255,0,0,0.1); }
  .search-bar input { flex: 1; background: transparent; border: none; padding: 10px 20px; color: var(--text); outline: none; font-size: 14px; }
  .search-bar button { background: transparent; border: none; padding: 0 20px; color: var(--muted); cursor: pointer; transition: 0.2s; }
  .search-bar button:hover { color: var(--text); }
  .top-actions { display: flex; gap: 18px; font-size: 20px; align-items: center; }
  .auth-btn { background: var(--red); color: white; border: none; padding: 8px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: var(--transition); box-shadow: 0 4px 15px rgba(255,0,0,0.3); }
  .auth-btn:hover { transform: translateY(-2px); }
  .user-avatar-top { width: 38px; height: 38px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; cursor: pointer; border: 2px solid var(--border); overflow: hidden; }
  .user-avatar-top img { width: 100%; height: 100%; object-fit: cover; }

  /* Views */
  .view { display: none; animation: fadeSlide 0.4s ease-out; flex: 1; }
  .view.active { display: block; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  /* Video Grid */
  .video-grid { display: grid; grid-template-columns: 1fr; gap: 24px; padding: 20px; }
  @media (min-width: 600px) { .video-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1000px) { .video-grid { grid-template-columns: repeat(3, 1fr); } }
  
  .video-card { cursor: pointer; border-radius: var(--radius); overflow: hidden; background: var(--card); transition: var(--transition); border: 1px solid var(--border); position: relative; backdrop-filter: var(--glass-blur); }
  .video-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.2); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
  .video-card-thumb { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; overflow: hidden; }
  .video-card-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
  .video-card-thumb img.loaded { opacity: 1; }
  .thumb-skeleton { position: absolute; inset: 0; background: linear-gradient(90deg, #1e1e1e 25%, #2a2a2a 50%, #1e1e1e 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; z-index: 1; }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

  .video-card-info { display: flex; gap: 14px; padding: 16px; }
  .channel-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--card-hover); display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; overflow: hidden; border: 1px solid var(--border); }
  .channel-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .video-meta { flex: 1; overflow: hidden; }
  .video-title { font-size: 16px; font-weight: 700; line-height: 1.5; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video-channel-name { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .video-stats { font-size: 12px; color: var(--muted); }

  /* Shorts */
  #viewShorts { background: #000; padding: 0; }
  .shorts-feed { height: calc(100vh - 80px); overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; }
  .shorts-feed::-webkit-scrollbar { display: none; }
  .short-page { height: calc(100vh - 80px); scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
  .short-page video { width: 100%; height: 100%; object-fit: contain; }
  .short-side-actions { position: absolute; bottom: 40px; right: 20px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 10; }
  .short-action-btn { background: rgba(255,255,255,0.1); backdrop-filter: var(--glass-blur); border: 1px solid var(--border); color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); }
  .short-action-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
  .short-action-btn i { font-size: 24px; }
  .short-action-btn span { font-size: 12px; margin-top: 4px; font-weight: bold; }
  .short-info { position: absolute; bottom: 40px; left: 20px; right: 90px; z-index: 10; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
  .short-info h3 { font-size: 18px; margin-bottom: 8px; font-weight: 800; }
  .short-info p { font-size: 14px; color: #ddd; }

  /* Player */
  #viewPlayer { background: var(--bg); }
  .player-container { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
  .player-container video { width: 100%; height: 100%; object-fit: contain; z-index: 2; }
  
  .player-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); z-index: 5; transition: opacity 0.3s; }
  .player-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--red); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { color: var(--muted); font-size: 14px; margin-top: 15px; text-align: center; }

  .player-details { padding: 20px; background: var(--bg); }
  .player-title-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
  .player-title { font-size: 20px; font-weight: 800; line-height: 1.5; flex: 1; margin-left: 10px; }
  
  .owner-actions { display: none; gap: 10px; }
  .owner-actions.visible { display: flex; }
  .btn-delete-video { background: rgba(255,0,0,0.1); color: var(--red); border: 1px solid var(--red); padding: 8px 14px; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 6px; transition: var(--transition); }
  .btn-delete-video:hover { background: var(--red); color: white; }

  .player-actions { display: flex; gap: 12px; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
  .player-actions::-webkit-scrollbar { display: none; }
  .player-action-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 30px; display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: var(--transition); }
  .player-action-btn:hover { background: var(--card-hover); }
  .player-action-btn.liked { background: rgba(255,0,0,0.15); color: var(--red); border-color: var(--red); }
  
  .player-channel { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
  .subscribe-btn { background: var(--text); color: var(--bg); border: none; padding: 10px 22px; border-radius: 25px; font-weight: 800; cursor: pointer; font-size: 13px; transition: var(--transition); }
  .subscribe-btn:hover { transform: scale(1.05); }

  .comments-section { padding: 0; }
  .comment-input-wrapper { display: flex; gap: 12px; margin-bottom: 25px; align-items: center; }
  .comment-input-wrapper input { flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 14px 20px; border-radius: 30px; outline: none; font-size: 14px; transition: var(--transition); }
  .comment-input-wrapper input:focus { border-color: var(--red); }
  .comment-input-wrapper button { background: var(--red); color: white; border: none; padding: 12px 24px; border-radius: 30px; cursor: pointer; font-weight: bold; transition: var(--transition); }
  .comment-input-wrapper button:hover { transform: scale(1.05); }
  .comment-item { display: flex; gap: 12px; margin-bottom: 18px; }

  /* Upload */
  .upload-container { max-width: 600px; margin: 0 auto; padding: 25px; }
  .upload-box { background: var(--card); border-radius: var(--radius); padding: 30px; border: 1px solid var(--border); backdrop-filter: var(--glass-blur); }
  .form-group { margin-bottom: 25px; }
  .form-group label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
  .form-group input[type="text"] { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 15px; border-radius: 12px; color: var(--text); outline: none; font-size: 15px; transition: var(--transition); }
  .form-group input[type="text"]:focus { border-color: var(--red); }
  .type-selector { display: flex; gap: 12px; margin-bottom: 25px; }
  .type-btn { flex: 1; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text); border-radius: 12px; cursor: pointer; text-align: center; font-weight: 600; transition: var(--transition); }
  .type-btn.active { border-color: var(--red); background: rgba(255,0,0,0.1); color: var(--red); }

  .upload-section-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: var(--text); display: flex; align-items: center; gap: 10px; }
  .upload-section-title .badge { background: var(--red); color: white; font-size: 11px; padding: 3px 8px; border-radius: 6px; }
  
  .uc-wrapper { position: relative; width: 100%; min-height: 180px; border-radius: var(--radius); overflow: hidden; background: rgba(0,0,0,0.3); border: 2px dashed var(--border); transition: var(--transition); margin-bottom: 25px; }
  .uc-wrapper.disabled { opacity: 0.5; pointer-events: none; }
  
  .checkbox-group { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); cursor: pointer; margin-top: 15px; }
  .checkbox-group input { width: 20px; height: 20px; accent-color: var(--red); cursor: pointer; }
  
  uc-file-uploader-regular { --uc-color-primary: #ff0000; --uc-color-primary-hover: #cc0000; --uc-color-background: #1e1e1e; --uc-color-text: #f1f1f1; --uc-color-border: rgba(255,255,255,0.1); --uc-border-radius: 12px; --uc-font-family: 'Vazirmatn', sans-serif; }

  /* Profile */
  .profile-header { display: flex; flex-direction: column; align-items: center; padding: 50px 20px; background: linear-gradient(180deg, rgba(255,0,0,0.08) 0%, transparent 100%); border-bottom: 1px solid var(--border); }
  .profile-avatar { width: 110px; height: 110px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 45px; font-weight: bold; margin-bottom: 20px; border: 3px solid var(--red); overflow: hidden; box-shadow: 0 0 30px rgba(255,0,0,0.2); }
  .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-name { font-size: 26px; font-weight: 900; margin-bottom: 10px; }
  .profile-stats { display: flex; gap: 25px; color: var(--muted); font-size: 15px; font-weight: 600; margin-bottom: 20px; }
  .edit-profile-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 24px; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: var(--transition); }
  .edit-profile-btn:hover { background: var(--card-hover); }

  /* Bottom Nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 1200px; background: rgba(15, 15, 15, 0.85); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--muted); background: none; border: none; font-size: 12px; cursor: pointer; width: 20%; padding: 5px 0; transition: var(--transition); }
  .nav-item i { font-size: 24px; transition: var(--transition); }
  .nav-item.active { color: var(--text); }
  .nav-item.active i { color: var(--red); transform: translateY(-3px); }

  /* Modals */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
  .modal-overlay.show { display: flex; }
  .modal-box { background: var(--card); padding: 35px; border-radius: 20px; width: 100%; max-width: 420px; text-align: center; border: 1px solid var(--border); position: relative; backdrop-filter: var(--glass-blur); }
  .modal-box h2 { margin-bottom: 25px; color: var(--red); font-size: 22px; }
  .modal-box input { width: 100%; padding: 14px; margin-bottom: 18px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: white; outline: none; font-size: 14px; transition: var(--transition); }
  .modal-box input:focus { border-color: var(--red); }
  .modal-box button { width: 100%; padding: 14px; background: var(--red); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: var(--transition); }
  .modal-box button:hover { transform: scale(1.02); }
  .modal-switch { color: var(--muted); font-size: 14px; cursor: pointer; transition: 0.2s; }
  .modal-switch:hover { color: var(--text); }
  .close-modal { position: absolute; top: 20px; right: 20px; background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

  /* Live Stream */
  .live-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .live-video-wrapper { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #000; border-radius: var(--radius); overflow: hidden; border: 2px solid var(--red); box-shadow: 0 0 30px rgba(255,0,0,0.3); }
  .live-video-wrapper video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); /* آینه برای دوربین سلفی */ }
  .live-badge { position: absolute; top: 15px; left: 15px; background: var(--red); color: white; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 6px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  .live-controls { display: flex; gap: 15px; margin-top: 25px; }
  .live-control-btn { padding: 15px 30px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; font-size: 15px; display: flex; align-items: center; gap: 10px; transition: var(--transition); }
  .btn-start-live { background: var(--red); color: white; }
  .btn-stop-live { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-start-live:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(255,0,0,0.4); }

  .toast { position: fixed; bottom: 100px; left: 50%; transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 14px 28px; border-radius: 30px; font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 999; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--red); color: white; }
  .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); grid-column: 1/-1; }
</style>
</head>
<body>

<div class="app-wrapper">
  <div class="topbar">
    <div class="logo" id="logoBtn"><i class="fab fa-youtube"></i> Vigram</div>
    <div class="search-bar"><input type="text" id="searchInput" placeholder="جستجو..." oninput="handleSearch(this.value)"><button><i class="fas fa-search"></i></button></div>
    <div class="top-actions" id="topActions"></div>
  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <button class="close-modal" onclick="closeAuth()">&times;</button>
      <h2><i class="fab fa-youtube"></i> Vigram</h2>
      <p style="margin-bottom:25px; color:var(--muted); font-size: 14px;">برای این کار باید وارد شوید.</p>
      <input type="text" id="authUsername" placeholder="نام کاربری" style="display:none;">
      <input type="email" id="authEmail" placeholder="ایمیل">
      <input type="password" id="authPassword" placeholder="رمز عبور">
      <button id="submitAuthBtn" onclick="handleAuth()">ورود</button>
      <div class="modal-switch" id="switchAuth" onclick="toggleAuthMode()">حساب ندارید؟ ثبت‌نام کنید</div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="editProfileModal">
    <div class="modal-box">
      <button class="close-modal" onclick="closeEditProfile()">&times;</button>
      <h2>ویرایش پروفایل</h2>
      <div style="margin-bottom: 20px;">
        <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:8px; text-align:right;">نام کاربری جدید</label>
        <input type="text" id="editNameInput" placeholder="نام جدید">
      </div>
      <div style="margin-bottom: 20px;">
        <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:8px; text-align:right;">آواتار جدید</label>
        <div class="uc-wrapper" id="avatarUploaderWrapper" style="min-height:120px; border-radius:12px;">
          <uc-config ctx-name="avatar-uploader" pubkey="634057eb7c1c635917d2" source-list="local" accept="image/*" multiple="false"></uc-config>
          <uc-file-uploader-regular ctx-name="avatar-uploader"></uc-file-uploader-regular>
          <uc-upload-ctx-provider ctx-name="avatar-uploader"></uc-upload-ctx-provider>
        </div>
      </div>
      <button onclick="saveProfileChanges()">ذخیره تغییرات</button>
    </div>
  </div>

  <div class="view active" id="viewHome">
    <div class="shorts-section" id="shortsSection" style="display:none; padding: 20px; border-bottom: 1px solid var(--border);">
      <div style="font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; margin-bottom: 15px;"><i class="fas fa-bolt" style="color:var(--red);"></i> شورت‌ها</div>
      <div class="shorts-scroll" id="shortsScroll" style="display:flex; gap:15px; overflow-x:auto; scrollbar-width:none;"></div>
    </div>
    <div class="video-grid" id="videoGrid"></div>
  </div>

  <div class="view" id="viewShorts"><div class="shorts-feed" id="shortsFeed"></div></div>

  <div class="view" id="viewPlayer">
    <div class="player-container">
      <video id="playerVideo" controls playsinline preload="metadata"></video>
      <div class="player-overlay hidden" id="playerOverlay">
        <div class="spinner" id="playerSpinner"></div>
        <div class="error-msg" id="playerErrorMsg"></div>
      </div>
    </div>
    <div class="player-details">
      <div class="player-title-row">
        <h1 class="player-title" id="playerTitle">عنوان ویدیو</h1>
        <div class="owner-actions" id="ownerActions">
          <button class="btn-delete-video" onclick="deleteBrokenVideo()"><i class="fas fa-trash"></i> حذف</button>
        </div>
      </div>
      <div class="player-actions">
        <button class="player-action-btn" id="playerLikeBtn" onclick="togglePlayerLike()"><i class="fas fa-thumbs-up"></i> <span id="playerLikes">0</span></button>
        <button class="player-action-btn" onclick="shareVideo()"><i class="fas fa-share"></i> اشتراک</button>
      </div>
      <div class="player-channel">
        <div class="channel-avatar" id="playerChannelAvatar">U</div>
        <div class="player-channel-info" onclick="openChannelProfile()" style="cursor:pointer;">
          <h4 id="playerChannelName">نام کانال</h4>
        </div>
      </div>
      <div class="comments-section">
        <h3 style="font-size:18px; margin-bottom:20px;">نظرات (<span id="playerCommentCount">0</span>)</h3>
        <div id="playerCommentsList"></div>
        <div class="comment-input-wrapper"><input type="text" id="playerCommentInput" placeholder="فقط کامنت انگلیسی..."><button onclick="addPlayerComment()">ارسال</button></div>
      </div>
    </div>
  </div>

  <div class="view" id="viewUpload">
    <div class="upload-container">
      <div class="upload-box">
        <h2 style="margin-bottom: 25px; text-align:center;"><i class="fas fa-cloud-upload-alt" style="color:var(--red);"></i> آپلود ویدیو جدید</h2>
        
        <div class="form-group">
          <label>عنوان ویدیو</label>
          <input type="text" id="uploadTitle" placeholder="یک عنوان جذاب بنویسید...">
        </div>

        <div class="form-group">
          <label>نوع ویدیو</label>
          <div class="type-selector">
            <div class="type-btn active" id="typeVideoBtn" onclick="setUploadType('video')"><i class="fas fa-film"></i> ویدیوی معمولی</div>
            <div class="type-btn" id="typeShortBtn" onclick="setUploadType('short')"><i class="fas fa-bolt"></i> شورت</div>
          </div>
        </div>

        <label class="checkbox-group" style="margin-bottom: 25px;">
          <input type="checkbox" id="agreeRules">
          <span>قوانین و محدودیت‌ها (۳ پست در روز) را می‌پذیرم.</span>
        </label>

        <div class="form-group">
          <div class="upload-section-title"><span>۱. فایل ویدیو</span> <span class="badge">الزامی</span></div>
          <div class="uc-wrapper disabled" id="videoWrapper">
            <uc-config ctx-name="video-uploader" pubkey="634057eb7c1c635917d2" source-list="local" accept="video/*" multiple="false" max-local-file-size-bytes="52428800"></uc-config>
            <uc-file-uploader-regular ctx-name="video-uploader"></uc-file-uploader-regular>
            <uc-upload-ctx-provider ctx-name="video-uploader"></uc-upload-ctx-provider>
          </div>
        </div>

        <div class="form-group">
          <div class="upload-section-title"><span>۲. تصویر پیش‌نمایش (Thumbnail)</span> <span class="badge" style="background: var(--muted);">اختیاری</span></div>
          <div class="uc-wrapper disabled" id="thumbWrapper">
            <uc-config ctx-name="thumb-uploader" pubkey="634057eb7c1c635917d2" source-list="local" accept="image/*" multiple="false"></uc-config>
            <uc-file-uploader-regular ctx-name="thumb-uploader"></uc-file-uploader-regular>
            <uc-upload-ctx-provider ctx-name="thumb-uploader"></uc-upload-ctx-provider>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- LIVE STREAM VIEW -->
  <div class="view" id="viewLive">
    <div class="live-container">
      <h2 style="margin-bottom: 25px; color: var(--red);"><i class="fas fa-broadcast-tower"></i> پخش زنده</h2>
      <div class="live-video-wrapper">
        <video id="liveVideo" autoplay playsinline muted></video>
        <div class="live-badge" id="liveBadge" style="display:none;"><i class="fas fa-circle"></i> زنده</div>
      </div>
      <div class="live-controls">
        <button class="live-control-btn btn-start-live" id="startLiveBtn" onclick="startLiveStream()"><i class="fas fa-video"></i> شروع پخش زنده</button>
        <button class="live-control-btn btn-stop-live" id="stopLiveBtn" onclick="stopLiveStream()" style="display:none;"><i class="fas fa-stop"></i> پایان پخش</button>
      </div>

  <div class="view" id="viewProfile">
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar">U</div>
      <div class="profile-name" id="profileName">User</div>
      <div class="profile-stats">
        <span><b id="profileVideoCount">0</b> ویدیو</span>
      </div>
      <button class="edit-profile-btn" onclick="openEditProfile()"><i class="fas fa-edit"></i> ویرایش پروفایل</button>
    </div>
    <div class="video-grid" id="profileVideoGrid"></div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" id="navHome"><i class="fas fa-home"></i><span>خانه</span></button>
    <button class="nav-item" id="navShorts"><i class="fas fa-bolt"></i><span>شورت‌ها</span></button>
    <button class="nav-item" id="navLive"><i class="fas fa-broadcast-tower"></i><span>پخش زنده</span></button>
    <button class="nav-item" id="navUpload"><i class="fas fa-plus-circle"></i><span>آپلود</span></button>
    <button class="nav-item" id="navProfile"><i class="fas fa-user-circle"></i><span>پروفایل</span></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==========================================
// تنظیمات
// ==========================================
const BACKENDLESS_APP_ID = "C50651A5-1DFC-4BA1-AA34-B4444E9AC5A5";
const BACKENDLESS_JS_API_KEY = "9303E7E8-BAF9-4023-A34B-E4E024192785";

const FALLBACK_THUMB = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="640" height="360" fill="%230f0f0f"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="%23ff0000">Vigram</text></svg>';

try { if (typeof Backendless !== 'undefined') { Backendless.initApp(BACKENDLESS_APP_ID, BACKENDLESS_JS_API_KEY); } } catch (e) { console.error(e); }

let videos = [];
let currentUser = null;
let currentUploadType = 'video';
let currentPlayerVideoId = null;
let currentChannelId = null; // برای پروفایل کانال
let currentSearchQuery = '';
let pendingVideoData = null;
let pendingThumbData = null;
let pendingAvatarData = null;
let isLoginMode = true;
let liveStream = null; // برای دوربین

// ==========================================
// توابع کمکی
// ==========================================
function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}
function formatNum(n) { return (n || 0).toLocaleString('fa-IR'); }
function formatDate(ts) { if (!ts) return ''; return new Date(ts).toLocaleDateString('fa-IR'); }
function cleanEmail(email) { return email.replace(/-/g, '').trim().toLowerCase(); }

function getUserName(user) {
  if (!user) return 'کاربر';
  return user.name || (user.email ? user.email.split('@')[0] : 'کاربر');
}

function getUserAvatar(user) {
  if (!user) return null;
  return user.avatarUrl || null;
}

// ==========================================
// احراز هویت
// ==========================================
function toggleAuthMode() {
  isLoginMode = !isLoginMode;
  document.getElementById('authUsername').style.display = isLoginMode ? 'none' : 'block';
  document.getElementById('submitAuthBtn').textContent = isLoginMode ? 'ورود' : 'ثبت‌نام';
  document.getElementById('switchAuth').textContent = isLoginMode ? 'حساب ندارید؟ ثبت‌نام کنید' : 'حساب دارید؟ وارد شوید';
}
function openAuth() { document.getElementById('authModal').classList.add('show'); }
function closeAuth() { document.getElementById('authModal').classList.remove('show'); }

async function handleAuth() {
  if (typeof Backendless === 'undefined') { toast('خطا: سرور متصل نیست.', true); return; }

  const email = cleanEmail(document.getElementById('authEmail').value);
  const password = document.getElementById('authPassword').value;
  const username = document.getElementById('authUsername').value.trim();

  if (!email || !password || (!isLoginMode && !username)) {
    toast('لطفاً همه فیلدها را پر کنید.', true); return;
  }

  try {
    if (isLoginMode) {
      await Backendless.UserService.login(email, password, true);
    } else {
      const user = new Backendless.User();
      user.email = email;
      user.password = password;
      user.name = username;
      
      await Backendless.UserService.register(user);
      await Backendless.UserService.login(email, password, true);
    }
    
    closeAuth();
    checkUserSession();
    loadVideosFromServer();
    toast('خوش آمدید!');
    
  } catch (err) {
    console.error(err);
    let msg = err.message || 'خطا در احراز هویت';
    if (msg.includes('already exists')) msg = 'این ایمیل قبلاً ثبت شده است.';
    if (msg.includes('Invalid login')) msg = 'ایمیل یا رمز عبور اشتباه است.';
    if (msg.includes('Column \'name\' does not exist')) {
      msg = 'خطا: لطفاً ستون name را در Backendless بسازید.';
    }
    toast(msg, true);
  }
}

async function logout() {
  if (typeof Backendless !== 'undefined') { await Backendless.UserService.logout().catch(()=>{}); }
  currentUser = null;
  updateTopbar();
  switchView('home');
  toast('خارج شدید.');
}

function checkUserSession() {
  if (typeof Backendless === 'undefined') return;
  currentUser = Backendless.UserService.getCurrentUser();
  updateTopbar();
}

function updateTopbar() {
  const topActions = document.getElementById('topActions');
  if (currentUser) {
    const name = getUserName(currentUser);
    const avatar = getUserAvatar(currentUser);
    
    topActions.innerHTML = `
      <i class="fas fa-bell"></i>
      <div class="user-avatar-top" onclick="switchView('profile')">
        ${avatar ? `<img src="${avatar}">` : name.charAt(0).toUpperCase()}
      </div>
      <i class="fas fa-sign-out-alt" onclick="logout()" title="خروج" style="cursor:pointer; font-size:16px;"></i>
    `;
    
    document.getElementById('profileAvatar').innerHTML = avatar ? `<img src="${avatar}">` : name.charAt(0).toUpperCase();
    document.getElementById('profileName').textContent = name;
  } else {
    topActions.innerHTML = `
      <i class="fas fa-bell"></i>
      <button class="auth-btn" onclick="openAuth()"><i class="fas fa-sign-in-alt"></i> ورود / ثبت‌نام</button>
    `;
  }
}

// ==========================================
// ویرایش پروفایل و آواتار
// ==========================================
function openEditProfile() {
  if (!currentUser) { openAuth(); return; }
  document.getElementById('editNameInput').value = getUserName(currentUser);
  pendingAvatarData = null;
  document.getElementById('editProfileModal').classList.add('show');
}
function closeEditProfile() { document.getElementById('editProfileModal').classList.remove('show'); }

async function saveProfileChanges() {
  if (!currentUser) return;
  const newName = document.getElementById('editNameInput').value.trim();
  if (!newName) { toast('نام نمی‌تواند خالی باشد.', true); return; }
  
  try {
    const updateData = { name: newName };
    if (pendingAvatarData) { updateData.avatarUrl = pendingAvatarData; }
    
    await Backendless.Data.of("Users").save({ objectId: currentUser.objectId, ...updateData });
    
    currentUser.name = newName;
    if (pendingAvatarData) currentUser.avatarUrl = pendingAvatarData;
    
    closeEditProfile();
    updateTopbar();
    renderProfile();
    toast('پروفایل با موفقیت آپدیت شد!');
  } catch(err) {
    console.error(err);
    toast('خطا در ذخیره: ' + err.message, true);
  }
}

async function setupAvatarUploader() {
  try {
    const UC = await import('https://cdn.jsdelivr.net/npm/@uploadcare/file-uploader@1/web/file-uploader.min.js');
    UC.defineComponents(UC);
    
    const avatarCtx = document.querySelector('uc-upload-ctx-provider[ctx-name="avatar-uploader"]');
    avatarCtx.addEventListener('common-upload-success', (e) => {
      const entries = e.detail.successEntries || [];
      if (!entries.length) return;
      pendingAvatarData = entries[0].cdnUrl;
      toast('آواتار آپلود شد. دکمه ذخیره را بزنید.');
    });
  } catch(e) { console.error(e); }
}

// ==========================================
// لود ویدیوها
// ==========================================
async function loadVideosFromServer() {
  if (typeof Backendless === 'undefined') return;
  try {
    const query = Backendless.DataQueryBuilder.create().setSortBy("created desc");
    const result = await Backendless.Data.of("Videos").find(query);
    videos = result.map(v => ({
      objectId: v.objectId, id: v.objectId, uuid: v.videoUuid, url: v.videoUrl,
      thumbnailUrl: v.thumbnailUrl, title: v.title, type: v.type,
      uploaderId: v.uploaderId, uploader: v.uploaderName || 'کاربر',
      timestamp: v.created, likes: v.likes || 0, views: v.views || 0
    }));
    renderHome();
    renderShorts();
    if (currentChannelId) loadChannelProfile(currentChannelId);
  } catch (err) {
    console.error("DB Error:", err);
    document.getElementById('videoGrid').innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>خطا در اتصال به سرور</h3><p style="font-size:13px; margin-top:10px;">${err.message}</p></div>`;
  }
}

// ==========================================
// رندر و گرافیک
// ==========================================
function filterVideos(list) {
  if (!currentSearchQuery) return list;
  const q = currentSearchQuery.toLowerCase();
  return list.filter(v => v.title.toLowerCase().includes(q) || (v.uploader || '').toLowerCase().includes(q));
}

function createVideoCardHTML(v) {
  const thumbSrc = v.thumbnailUrl || FALLBACK_THUMB;
  const uploaderName = v.uploader || 'کاربر';
  return `
    <div class="video-card" onclick="openPlayer('${v.id}')">
      <div class="video-card-thumb">
        <div class="thumb-skeleton"></div>
        <img src="${thumbSrc}" loading="lazy" onload="this.classList.add('loaded'); this.previousElementSibling.style.display='none';" onerror="this.src='${FALLBACK_THUMB}'; this.classList.add('loaded'); this.previousElementSibling.style.display='none';">
      </div>
      <div class="video-card-info">
        <div class="channel-avatar">${uploaderName.charAt(0).toUpperCase()}</div>
        <div class="video-meta">
          <div class="video-title">${v.title}</div>
          <div class="video-channel-name">${uploaderName}</div>
          <div class="video-stats">${formatNum(v.views)} بازدید • ${formatDate(v.timestamp)}</div>
        </div>
      </div>
    </div>
  `;
}

function renderHome() {
  const grid = document.getElementById('videoGrid');
  const shortsSection = document.getElementById('shortsSection');
  const filteredVideos = filterVideos(videos);
  
  // رندر شورت‌ها (چه سرچ شده باشه چه نه)
  const shorts = filteredVideos.filter(v => v.type === 'short');
  if (shorts.length > 0) {
    shortsSection.style.display = 'block';
    document.getElementById('shortsScroll').innerHTML = shorts.map(s => `
      <div style="width:130px; height:230px; border-radius:12px; overflow:hidden; flex-shrink:0; cursor:pointer; position:relative; background:#000; border: 1px solid var(--border);" onclick="openPlayer('${s.id}')">
        <img src="${s.thumbnailUrl || FALLBACK_THUMB}" loading="lazy" style="width:100%; height:100%; object-fit:cover;">
        <div style="position:absolute; bottom:0; left:0; right:0; padding:8px; background:linear-gradient(transparent, rgba(0,0,0,0.9)); font-size:12px; font-weight:bold; text-shadow:0 1px 3px rgba(0,0,0,0.8);">${s.title}</div>
      </div>
    `).join('');
  } else { shortsSection.style.display = 'none'; }

  const longVideos = filteredVideos.filter(v => v.type === 'video');
  if (longVideos.length === 0) {
    grid.innerHTML = `<div class="empty-state"><i class="fas fa-video" style="font-size:50px; margin-bottom:15px;"></i><h3>${currentSearchQuery ? 'نتیجه‌ای یافت نشد' : 'هنوز ویدیویی وجود ندارد'}</h3></div>`; return;
  }
  grid.innerHTML = longVideos.map(createVideoCardHTML).join('');
}

function renderShorts() {
  const feed = document.getElementById('shortsFeed');
  const shorts = filterVideos(videos.filter(v => v.type === 'short'));
  if (shorts.length === 0) { feed.innerHTML = '<div style="color:white; text-align:center; padding:80px;">هنوز شورتی وجود ندارد.</div>'; return; }
  feed.innerHTML = shorts.map(s => `
    <div class="short-page">
      <video src="${s.url}" loop playsinline preload="none" onclick="toggleShortPlay(this)"></video>
      <div class="short-info"><h3>@${s.uploader}</h3><p>${s.title}</p></div>
      <div class="short-side-actions">
        <button class="short-action-btn" onclick="toggleShortLike('${s.id}')"><i class="fas fa-heart"></i><span>${formatNum(s.likes)}</span></button>
        <button class="short-action-btn" onclick="openPlayer('${s.id}')"><i class="fas fa-comment"></i><span>0</span></button>
      </div>
    </div>
  `).join('');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target.querySelector('video');
      if (entry.isIntersecting) video.play().catch(()=>{});
      else video.pause();
    });
  }, { threshold: 0.6 });
  document.querySelectorAll('.short-page').forEach(p => observer.observe(p));
}

// ==========================================
// پروفایل (کانال)
// ==========================================
async function renderProfile() {
  if (!currentUser) { openAuth(); return; }
  document.getElementById('profileName').textContent = getUserName(currentUser);
  document.getElementById('profileAvatar').innerHTML = getUserAvatar(currentUser) ? `<img src="${getUserAvatar(currentUser)}">` : getUserName(currentUser).charAt(0).toUpperCase();
  
  try {
    const query = Backendless.DataQueryBuilder.create().setWhereClause(`uploaderId='${currentUser.objectId}'`);
    const userVideos = await Backendless.Data.of("Videos").find(query);
    document.getElementById('profileVideoCount').textContent = formatNum(userVideos.length);
    
    const grid = document.getElementById('profileVideoGrid');
    if (userVideos.length === 0) { grid.innerHTML = `<div class="empty-state"><i class="fas fa-video" style="font-size:50px; margin-bottom:15px;"></i><h3>هنوز ویدیویی آپلود نکرده‌اید</h3></div>`; return; }
    
    grid.innerHTML = userVideos.map(v => createVideoCardHTML({ ...v, id: v.objectId, uploader: v.uploaderName || 'کاربر', timestamp: v.created })).join('');
  } catch(e) { console.error(e); }
}

async function openChannelProfile() {
  if (!currentChannelId) return;
  if (currentUser && currentChannelId === currentUser.objectId) { switchView('profile'); return; }
  
  try {
    const query = Backendless.DataQueryBuilder.create().setWhereClause(`uploaderId='${currentChannelId}'`);
    const channelVideos = await Backendless.Data.of("Videos").find(query);
    
    // نمایش در صفحه پروفایل
    const channelName = channelVideos.length > 0 ? (channelVideos[0].uploaderName || 'کانال') : 'کانال';
    document.getElementById('profileName').textContent = channelName;
    document.getElementById('profileAvatar').innerHTML = channelName.charAt(0).toUpperCase();
    document.getElementById('profileVideoCount').textContent = formatNum(channelVideos.length);
    
    const grid = document.getElementById('profileVideoGrid');
    if (channelVideos.length === 0) { grid.innerHTML = `<div class="empty-state"><i class="fas fa-video"></i><h3>ویدیویی ندارد</h3></div>`; return; }
    grid.innerHTML = channelVideos.map(v => createVideoCardHTML({ ...v, id: v.objectId, uploader: v.uploaderName, timestamp: v.created })).join('');
    
    switchView('profile');
    
  } catch(e) { console.error(e); }
}

// ==========================================
// پلیر
// ==========================================
const playerVideo = document.getElementById('playerVideo');
const playerOverlay = document.getElementById('playerOverlay');
const playerSpinner = document.getElementById('playerSpinner');
const playerErrorMsg = document.getElementById('playerErrorMsg');

function showLoader() { playerOverlay.classList.remove('hidden'); playerSpinner.style.display = 'block'; playerErrorMsg.textContent = ''; }
function hideLoader() { playerOverlay.classList.add('hidden'); }
function showError(msg) { playerOverlay.classList.remove('hidden'); playerSpinner.style.display = 'none'; playerErrorMsg.textContent = msg; }

function setupPlayer(url) {
  playerVideo.removeAttribute('src');
  playerVideo.src = url; playerVideo.load(); playerVideo.play().catch(()=>{});
}

playerVideo.addEventListener('waiting', showLoader);
playerVideo.addEventListener('playing', hideLoader);
playerVideo.addEventListener('canplay', hideLoader);
playerVideo.addEventListener('error', () => showError("مشکل در پخش ویدیو"));

async function openPlayer(id) {
  const v = videos.find(x => x.id === id);
  if (!v) return;
  currentPlayerVideoId = id;
  currentChannelId = v.uploaderId;
  
  try { Backendless.Data.of("Videos").save({ objectId: id, views: (v.views || 0) + 1 }).catch(()=>{}); } catch(e){}
  v.views++;
  
  switchView('player'); showLoader(); setupPlayer(v.url);
  
  document.getElementById('playerTitle').textContent = v.title;
  document.getElementById('playerLikes').textContent = formatNum(v.likes);
  document.getElementById('playerChannelName').textContent = v.uploader || 'کاربر';
  document.getElementById('playerChannelAvatar').textContent = (v.uploader || 'U').charAt(0).toUpperCase();
  
  if (currentUser && v.uploaderId === currentUser.objectId) {
    document.getElementById('ownerActions').classList.add('visible');
  } else {
    document.getElementById('ownerActions').classList.remove('visible');
  }

  try {
    const q = Backendless.DataQueryBuilder.create().setWhereClause(`videoId='${id}'`).setSortBy("created desc");
    const comments = await Backendless.Data.of("Comments").find(q);
    renderPlayerComments(comments);
  } catch(e) { renderPlayerComments([]); }
}

function renderPlayerComments(comments) {
  const list = document.getElementById('playerCommentsList');
  document.getElementById('playerCommentCount').textContent = formatNum(comments.length);
  if (comments.length === 0) { list.innerHTML = '<p style="color:var(--muted); font-size:13px;">اولین نظر را شما بنویسید!</p>'; return; }
  list.innerHTML = comments.map(c => `<div class="comment-item"><div class="channel-avatar" style="width:32px; height:32px; font-size:13px;">${(c.userName || 'U').charAt(0).toUpperCase()}</div><div class="comment-body"><h5 style="font-size:13px; color:var(--muted); margin-bottom:4px;">@${c.userName || 'User'}</h5><p style="font-size:14px;">${c.text}</p></div></div>`).join('');
}

async function togglePlayerLike() {
  if (!currentUser) { openAuth(); return; }
  const v = videos.find(x => x.id === currentPlayerVideoId);
  const isLiked = document.getElementById('playerLikeBtn').classList.contains('liked');
  try {
    await Backendless.Data.of("Videos").save({ objectId: v.id, likes: isLiked ? Math.max(0, v.likes - 1) : v.likes + 1 });
    v.likes = isLiked ? Math.max(0, v.likes - 1) : v.likes + 1;
    document.getElementById('playerLikes').textContent = formatNum(v.likes);
    document.getElementById('playerLikeBtn').classList.toggle('liked', !isLiked);
  } catch(e) { toast('خطا در ثبت لایک', true); }
}

async function addPlayerComment() {
  if (!currentUser) { openAuth(); return; }
  const input = document.getElementById('playerCommentInput'); 
  const text = input.value.trim(); 
  if (!text) return;
  
  if (/[\u0600-\u06FF]/.test(text)) {
    toast('❌ فقط کامنت‌های انگلیسی پذیرفته می‌شوند.', true); return;
  }
  
  try {
    await Backendless.Data.of("Comments").save({
      videoId: currentPlayerVideoId,
      userId: currentUser.objectId,
      userName: getUserName(currentUser),
      text: text
    });
    input.value = '';
    const q = Backendless.DataQueryBuilder.create().setWhereClause(`videoId='${currentPlayerVideoId}'`).setSortBy("created desc");
    const comments = await Backendless.Data.of("Comments").find(q);
    renderPlayerComments(comments);
    toast('نظر شما ثبت شد.');
  } catch(e) { toast('خطا در ثبت نظر', true); }
}

async function deleteBrokenVideo() {
  if (!confirm('آیا مطمئن هستید؟')) return;
  try {
    await Backendless.Data.of("Videos").remove({ objectId: currentPlayerVideoId });
    toast('حذف شد.'); loadVideosFromServer(); switchView('home');
  } catch(e) { toast('خطا در حذف', true); }
}

// ==========================================
// آپلود
// ==========================================
async function setupUploaders() {
  try {
    const UC = await import('https://cdn.jsdelivr.net/npm/@uploadcare/file-uploader@1/web/file-uploader.min.js');
    UC.defineComponents(UC);
    
    const rulesCheck = document.getElementById('agreeRules');
    const videoWrapper = document.getElementById('videoWrapper');
    const thumbWrapper = document.getElementById('thumbWrapper');

    rulesCheck.addEventListener('change', (e) => {
      if (e.target.checked) { videoWrapper.classList.remove('disabled'); thumbWrapper.classList.remove('disabled'); }
      else { videoWrapper.classList.add('disabled'); thumbWrapper.classList.add('disabled'); }
    });

    const videoCtx = document.querySelector('uc-upload-ctx-provider[ctx-name="video-uploader"]');
    videoCtx.addEventListener('common-upload-success', (e) => {
      if (!currentUser) { openAuth(); return; }
      const entries = e.detail.successEntries || [];
      if (!entries.length) return;
      
      const entry = entries[0];
      pendingVideoData = { uuid: entry.uuid, url: entry.cdnUrl, name: entry.name };
      
      if (pendingThumbData !== null) { finalizeUpload(); } 
      else {
        toast('ویدیو آپلود شد. تصویر پیش‌نمایش را آپلود کنید.');
        setTimeout(() => {
          if (pendingVideoData && pendingThumbData === null) { pendingThumbData = 'skip'; finalizeUpload(); }
        }, 10000);
      }
    });

    const thumbCtx = document.querySelector('uc-upload-ctx-provider[ctx-name="thumb-uploader"]');
    thumbCtx.addEventListener('common-upload-success', (e) => {
      const entries = e.detail.successEntries || [];
      if (!entries.length) return;
      pendingThumbData = entries[0].cdnUrl;
      toast('تصویر آپلود شد.');
      if (pendingVideoData) { finalizeUpload(); }
    });

    window.finalizeUpload = async function() {
      if (!pendingVideoData || !currentUser) return;
      
      const title = document.getElementById('uploadTitle').value.trim() || pendingVideoData.name.replace(/\.[^/.]+$/, "");
      const thumbnailUrl = (pendingThumbData && pendingThumbData !== 'skip') ? pendingThumbData : null;

      try {
        await Backendless.Data.of("Videos").save({
          title: title, videoUuid: pendingVideoData.uuid, videoUrl: pendingVideoData.url,
          thumbnailUrl: thumbnailUrl, type: currentUploadType,
          uploaderId: currentUser.objectId, uploaderName: getUserName(currentUser),
          views: 0, likes: 0
        });
        
        toast('ویدیو روی سرور ذخیره شد!');
        loadVideosFromServer();
        
        try { videoCtx.clearAll(); } catch(err){}
        try { thumbCtx.clearAll(); } catch(err){}
        pendingVideoData = null; pendingThumbData = null;
        document.getElementById('uploadTitle').value = '';
        rulesCheck.checked = false;
        videoWrapper.classList.add('disabled'); thumbWrapper.classList.add('disabled');
        
        switchView('home');
      } catch(err) { 
        console.error(err);
        toast('خطا در ذخیره در سرور: ' + err.message, true); 
      }
    };

  } catch(err) { console.error("Upload Init Error:", err); }
}

// ==========================================
// پخش زنده (Live Stream)
// ==========================================
async function startLiveStream() {
  if (!currentUser) { openAuth(); return; }
  
  try {
    // درخواست دسترسی به دوربین و میکروفون
    liveStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    const videoEl = document.getElementById('liveVideo');
    videoEl.srcObject = liveStream;
    
    document.getElementById('startLiveBtn').style.display = 'none';
    document.getElementById('stopLiveBtn').style.display = 'flex';
    document.getElementById('liveBadge').style.display = 'flex';
    
    toast('پخش زنده شروع شد!');
  } catch (err) {
    console.error(err);
    toast('دسترسی به دوربین ممکن نشد. لطفاً اجازه دسترسی بدهید.', true);
  }
}

function stopLiveStream() {
  if (liveStream) {
    liveStream.getTracks().forEach(track => track.stop());
    liveStream = null;
  }
  const videoEl = document.getElementById('liveVideo');
  videoEl.srcObject = null;
  
  document.getElementById('startLiveBtn').style.display = 'flex';
  document.getElementById('stopLiveBtn').style.display = 'none';
  document.getElementById('liveBadge').style.display = 'none';
  
  toast('پخش زنده متوقف شد.');
}

// ==========================================
// ناوبری
// ==========================================
function switchView(viewName) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('video').forEach(v => { try { v.pause(); } catch(e){} });
  
  if (viewName === 'home') { document.getElementById('viewHome').classList.add('active'); document.getElementById('navHome').classList.add('active'); }
  else if (viewName === 'shorts') { document.getElementById('viewShorts').classList.add('active'); document.getElementById('navShorts').classList.add('active'); }
  else if (viewName === 'live') { 
    if (!currentUser) { openAuth(); return; }
    document.getElementById('viewLive').classList.add('active'); document.getElementById('navLive').classList.add('active'); 
  }
  else if (viewName === 'upload') { 
    if (!currentUser) { openAuth(); return; }
    document.getElementById('viewUpload').classList.add('active'); document.getElementById('navUpload').classList.add('active'); 
  }
  else if (viewName === 'player') { document.getElementById('viewPlayer').classList.add('active'); }
  else if (viewName === 'profile') { 
    if (!currentUser) { openAuth(); return; }
    document.getElementById('viewProfile').classList.add('active'); document.getElementById('navProfile').classList.add('active'); renderProfile(); 
  }
}

function handleSearch(query) { currentSearchQuery = query; renderHome(); renderShorts(); }
function setUploadType(type) { currentUploadType = type; document.getElementById('typeVideoBtn').classList.toggle('active', type === 'video'); document.getElementById('typeShortBtn').classList.toggle('active', type === 'short'); }
function toggleShortPlay(videoEl) { if (videoEl.paused) videoEl.play(); else videoEl.pause(); }
function toggleShortLike(id) { if (!currentUser) { openAuth(); return; } toast('برای لایک، از صفحه پلیر استفاده کنید.'); }

document.getElementById('logoBtn').addEventListener('click', () => switchView('home'));
document.getElementById('navHome').addEventListener('click', () => switchView('home'));
document.getElementById('navShorts').addEventListener('click', () => switchView('shorts'));
document.getElementById('navLive').addEventListener('click', () => switchView('live'));
document.getElementById('navUpload').addEventListener('click', () => switchView('upload'));
document.getElementById('navProfile').addEventListener('click', () => switchView('profile'));

window.onload = () => {
  checkUserSession();
  loadVideosFromServer();
  setupUploaders();
  setupAvatarUploader();
  updateTopbar();
};
</script>
